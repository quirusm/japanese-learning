<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b35"><title>Japanese Every Day</title><style>body{font:18px system-ui;background:#f5f7f4;color:#173b35;margin:0}main{max-width:600px;margin:auto;padding:22px}header{background:#173b35;color:white;padding:20px;border-radius:18px}section{background:white;padding:22px;margin:18px 0;border-radius:18px;box-shadow:0 2px 9px #0001}button{border:0;border-radius:12px;padding:14px 18px;background:#16745b;color:white;font-size:17px;margin:5px;cursor:pointer}button.secondary{background:#e1eee9;color:#173b35}.jp{font-size:30px;font-weight:650}small{color:#52665e}progress{width:100%;height:16px}input{font-size:18px;padding:12px;max-width:90%}</style></head><body><main><header><h1>日本語 Every Day</h1><p>Japanese for real conversations · 30 minutes a day</p></header><section><h2>Day 1 · Introduce yourself</h2><p>Listen, repeat three times, then recall without looking.</p><progress id="bar" value="0" max="5"></progress><p id="count"></p><div class="jp" id="jp"></div><p id="rom"></p><p id="meaning"></p><small id="note"></small><p><button id="speak">▶ Hear Japanese</button><button class="secondary" id="hide">Hide / show meaning</button></p><button class="secondary" id="prev">← Back</button><button id="next">I practiced this →</button></section><section><h2>Recall challenge</h2><p>How do you say “I'm Mike” politely?</p><input id="answer" placeholder="Type in romaji"><button id="check">Check</button><p id="feedback"></p></section><section><h2>Daily routine</h2><p>10 min new phrases · 10 min speaking · 5 min recall · 5 min conversation.</p><p id="saved"></p><button class="secondary" id="reset">Restart lesson</button></section></main><script>const phrases=[["こんにちは","Konnichiwa","Hello / good afternoon","A daytime greeting."],["はじめまして","Hajimemashite","Nice to meet you","Used when first meeting someone."],["マイクです。","Maiku desu.","I'm Mike.","Desu is polite; its final u is often faint."],["日本語を勉強しています。","Nihongo o benkyō shite imasu.","I'm studying Japanese.","The particle を sounds like o."],["よろしくお願いします。","Yoroshiku onegaishimasu.","A polite closing to an introduction","Expresses goodwill; no exact English equivalent."]];let i=Number(localStorage.getItem('jp_index')||0),done=Number(localStorage.getItem('jp_done')||0),visible=true;function draw(){i=Math.max(0,Math.min(4,i));document.getElementById('jp').textContent=phrases[i][0];document.getElementById('rom').textContent=phrases[i][1];document.getElementById('meaning').textContent=visible?phrases[i][2]:'Meaning hidden — recall it first';document.getElementById('note').textContent=visible?phrases[i][3]:'';document.getElementById('count').textContent='Phrase '+(i+1)+' of 5';document.getElementById('bar').value=done;document.getElementById('saved').textContent=done+' of 5 phrases practiced. Progress saved on this device.';localStorage.setItem('jp_index',i);localStorage.setItem('jp_done',done)}document.getElementById('next').onclick=()=>{done=Math.max(done,i+1);i=Math.min(4,i+1);visible=false;draw()};document.getElementById('prev').onclick=()=>{i--;visible=true;draw()};document.getElementById('hide').onclick=()=>{visible=!visible;draw()};document.getElementById('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('Speech playback unavailable in this browser');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(phrases[i][0]);u.lang='ja-JP';u.rate=.78;speechSynthesis.speak(u)};document.getElementById('check').onclick=()=>{let s=document.getElementById('answer').value.toLowerCase().replace(/[^a-z]/g,'');document.getElementById('feedback').textContent=s==='maikudesu'?'Correct! マイクです。':'Try: Maiku desu.'};document.getElementById('reset').onclick=()=>{i=0;done=0;visible=true;draw()};draw()</script></body></html>
